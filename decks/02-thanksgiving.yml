# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "thanksgiving"
  title: "Thanksgiving Delivery Proposal for Remy Powell — Agape Farmstead"
  description: "Prepared for Remy Powell, Agape Farmstead owner. Evaluate a proposed Thanksgiving turkey delivery service without assuming new routes, rates, or commitments."
  og_title: "Remy Powell — Thanksgiving Delivery Feasibility"
  og_description: "A proposal for Remy to evaluate turkey deliveries with clear product, processing, legal, cold-chain, and route requirements before approval."
  eyebrow: "Prepared for Remy · Holiday Delivery"
  blurb: "Your existing Thanksgiving turkey offering provides a starting point; any additional delivery routes remain a proposal for your approval."
slides:
  - tag: "For Remy Powell · Thanksgiving 2026"
    layout: "hero"
    title: "Your Turkey,<br>__ACCENT__A Delivery Option."
    subtitle: "Remy, your published Thanksgiving offering includes a $20 whole-turkey deposit and a November 24 pickup or delivery date. Payton proposes evaluating additional customer deliveries—not treating a 200-mile radius or six corridors as an agreement you have made."
    stats:
      - n: "200"
        l: "Possible Radius · Miles"
      - n: "11/24"
        l: "Published Fulfillment Date"
      - n: "6"
        l: "Corridors for Evaluation"
  - tag: "The Decision"
    layout: "list"
    title: "Decisions Only You Can Approve"
    subtitle: "Before any additional delivery is advertised, you should confirm the actual birds, processor release timing, and how customer orders would be fulfilled."
    list:
      - "Confirm your available birds, expected weights, current $20 deposit arrangement, processing schedule, and inspection or exemption status."
      - "Decide whether to authorize a delivery arrangement covering fees, addresses, refunds, delays, insurance, responsibility, and customer contact."
      - "Check travel from the actual pickup point against refrigeration capacity, driver availability, and realistic delivery windows."
      - "Verify eligibility for any Kentucky or Alabama sales before offering service across state lines."
      - "Authorize only specific routes, deadlines, product allocations, and the person responsible for each delivery."
  - tag: "The Zone Map"
    layout: "map"
    title: "An Area for Your Consideration"
    map: "zones"
    caption: "This Nashville-centered, roughly 200-mile concept is presented for your evaluation. It is not a service area you have approved, a road-distance guarantee, or a statement of legal eligibility."
  - tag: "The Route Map"
    layout: "map"
    title: "Candidate Routes, Not Commitments"
    map: "routes"
    caption: "The six corridor sketches are options to study with you, not scheduled trips. Real dispatch plans depend on your processor release, actual pickup point, and available cold-chain capacity."
  - tag: "The Batches"
    layout: "cards"
    title: "Six Corridors You Could Evaluate"
    cards:
      - title: "I-24 Northwest"
        text: "Adams and Clarksville first; consider Hopkinsville and Paducah only after confirming interstate eligibility and your approval."
      - title: "I-24 Southeast"
        text: "Murfreesboro and Chattanooga, if buyer demand, release timing, and route costs support them."
      - title: "I-65 North"
        text: "Bowling Green, subject to applicable interstate requirements and your approval."
      - title: "I-65 South"
        text: "Huntsville, only after confirming interstate eligibility and economic viability."
      - title: "I-40 East"
        text: "Cookeville and Knoxville, if refrigerated transport and same-day timing permit."
      - title: "I-40 West"
        text: "Jackson, after verifying stops, cost, and fulfillment capacity."
    note: "Remy, you may accept one corridor, change the service area, or decline the expansion entirely. A processor's agreement alone does not settle interstate sales requirements."
  - phase: "01"
    layout: "phase"
    timeline: "October 24–31 · Validate"
    title: "First, Confirm Your Constraints"
    list:
      - "Review the deposits you already offer, reserved bird counts, processing release times, and current customer pickup arrangements."
      - "Estimate stops possible per vehicle using actual travel, loading, refrigeration, and handoff times."
      - "Verify the applicable inspection or exemption rules, state restrictions, and insurance obligations."
      - "Agree on delivery charges, cancellations, substitutions, customer support, and contingencies before launching anything."
    note: "If your processing schedule cannot support multiple delivery days, the proposed radius should not be advertised as available."
  - phase: "02"
    layout: "phase"
    timeline: "November 1–10 · Conditional Planning"
    title: "Open Only Approved Routes"
    list:
      - "Publish only the delivery locations, fees, deadlines, and arrival windows you have specifically approved."
      - "Keep your existing $20 turkey deposit distinct from any later weight-based balance and optional delivery fee."
      - "Limit bookings to birds and delivery slots you can actually fulfill; waitlist additional interest rather than promise capacity."
      - "Confirm the route and date to each customer before taking any additional delivery payment."
    note: "The November 10 planning cutoff is only a proposal. Your actual order deadline remains your decision."
  - phase: "03"
    layout: "phase"
    timeline: "November 11–24 · If Approved"
    title: "Deliver Under an Agreed Plan"
    list:
      - "Confirm your processor has released each bird and document product handoff to the delivery operator."
      - "Use suitable food-safe, validated refrigeration capable of keeping the product at or below 40°F during transit."
      - "Record loading, in-transit, and handoff temperatures; document recipients and exceptions."
      - "Provide delivery windows, an operator contact, and a clear plan for delays or temperature-control failures."
      - "Invite customers to share honest feedback after their orders arrive."
    subtitle: "Your processing, fulfillment, and approval requirements determine whether any added delivery route runs."
  - tag: "Why Test It"
    layout: "cards"
    title: "Why Test a Small Route First?"
    cards:
      - title: "Your Existing Reservations"
        text: "Your turkey-deposit listing gives us a place to start measuring demand without pretending that all customers want expanded delivery."
      - title: "Your Control of the Sale"
        text: "You retain responsibility for authorizing sales and product release; Payton's proposed role would be limited to deliveries agreed in writing."
      - title: "Better Route Economics"
        text: "Grouping nearby stops could reduce costs, but only when it preserves your product quality and dependable customer handoff."
  - tag: "Your Decision"
    layout: "ask"
    title: "Would You Approve a Route Study?"
    subtitle: "Remy, I am proposing a limited review of processing timing, legal eligibility, cost, temperature control, and one possible corridor. This request is not permission to start taking expanded-delivery orders."
    ask:
      title: "Delivery Feasibility · No Routes Committed"
      text: "Review one viable pilot with Payton, establish written responsibilities, and expand only if you decide that further corridors meet your standards."
      button: "Discuss Delivery with Payton"
      button_href: "mailto:plbyrd@gmail.com?subject=Remy%20Powell%20%E2%80%94%20Thanksgiving%20delivery%20proposal"
    footer: "{{contact}}"
  - tag: "The Table"
    layout: "close"
    title: "From Your Farm<br>to __ACCENT2__Their Table."
    subtitle: "A workable holiday delivery service must protect your reputation, your customers, your product, and your processing commitments."
    list:
      - "The six corridors are options for you to evaluate; none is an authorized route."
      - "Contact Payton Byrd at 615-574-8101 if you want to discuss a trial."
    footer: "{{contact}}"
