# Source content for ProposalDecks. Rebuild generated docs/ after merging.
meta:
  slug: "thanksgiving"
  title: "Thanksgiving Delivery Feasibility — Agape Farmstead"
  description: "A conditional plan to evaluate Thanksgiving turkey delivery corridors, product release timing, legal eligibility, safe transport, fees, and dispatch capacity."
  og_title: "Thanksgiving 2026 — Delivery Feasibility"
  og_description: "Evaluate proposed routes around Nashville against Agape's November 24 turkey offering before committing to an expanded service area."
  eyebrow: "Thanksgiving 2026 — Feasibility"
  blurb: "Assess candidate delivery corridors against processing, refrigeration, interstate eligibility, route economics, and farm approval."
slides:
  - tag: "Thanksgiving 2026"
    layout: "hero"
    title: "Fresh Turkey,<br>__ACCENT__A Plan to Validate."
    subtitle: "The farm advertises a $20 whole-turkey deposit and fresh pickup or delivery on Tuesday, November 24. A 200-mile Nashville-centered concept and six candidate corridors require separate approval; neither is an established service commitment."
    stats:
      - n: "200"
        l: "Proposed Radius · Miles"
      - n: "11/24"
        l: "Farm-Advertised Date"
      - n: "6"
        l: "Candidate Corridors"
  - tag: "The Decision"
    layout: "list"
    title: "What Must Be Agreed"
    subtitle: "Confirm product availability and processing release before publishing any new customer delivery promises."
    list:
      - "Verify bird count, expected weights, existing $20 deposit terms, processor release time, and inspection or exemption status."
      - "Define a written service scope — route fees, accepted addresses, insurance, refunds, delays, liability, and customer communications."
      - "Plan from the actual pickup point with realistic drive time, refrigeration capacity, and customer handoff windows—not radius alone."
      - "Confirm each state and sales channel is legally eligible before accepting orders for Kentucky or Alabama destinations."
      - "Dispatch only when the farm has approved the route, cutoff, product allocation, and responsible operator."
  - tag: "The Zone Map"
    layout: "map"
    title: "Illustrative Service Area"
    map: "zones"
    caption: "Concept only: straight-line distance from Nashville does not establish driving mileage, service coverage, food-transport capacity, or legal eligibility."
  - tag: "The Route Map"
    layout: "map"
    title: "Candidate Corridors"
    map: "routes"
    caption: "Six conceptual corridors for demand analysis, not scheduled deliveries. Stop numbers are illustrative; routes must start at the actual pickup location and respect processor release timing."
  - tag: "The Batches"
    layout: "cards"
    title: "Routes to Evaluate"
    cards:
      - title: "I-24 Northwest"
        text: "Adams and Clarksville; Hopkinsville and Paducah only if interstate movement is eligible and approved."
      - title: "I-24 Southeast"
        text: "Murfreesboro and Chattanooga, subject to demand and viable travel windows."
      - title: "I-65 North"
        text: "Bowling Green only if interstate movement is eligible and approved."
      - title: "I-65 South"
        text: "Huntsville only if interstate movement is eligible and approved."
      - title: "I-40 East"
        text: "Cookeville and Knoxville, subject to verified route and cold-chain capacity."
      - title: "I-40 West"
        text: "Jackson, subject to verified route and cold-chain capacity."
    note: "The farm may reduce, postpone, or reject any corridor. Processor consent alone does not establish legal authorization for interstate sales."
  - phase: "01"
    layout: "phase"
    timeline: "October 24–31 · Validate"
    title: "Confirm Product and Dispatch"
    list:
      - "Confirm turkey deposits already offered by the farm, product count, processor release times, and customer pickup commitments."
      - "Measure the number of safe deliveries possible per vehicle and route, including loading, drive time, stops, and temperature control."
      - "Verify inspection or exemption status and applicable state-specific transport and sales requirements."
      - "Agree on fees, liability, order cutoffs, substitutions, refunds, support, and contingency arrangements."
    note: "Decision gate: if fresh birds cannot be released early enough, do not advertise multiple corridor days or a blanket 200-mile promise."
  - phase: "02"
    layout: "phase"
    timeline: "November 1–10 · Conditional Planning"
    title: "Accept Only Deliverable Orders"
    list:
      - "Publish only farm-approved addresses, delivery fees, quantity and weight terms, deadlines, and customer arrival windows."
      - "Link to the farm's existing turkey reservation, clearly separating its $20 deposit from the final weight-based charge and any delivery fee."
      - "Close or waitlist a corridor when confirmed allocations, refrigeration capacity, or route timing are exhausted."
      - "Notify each buyer of the validated route and delivery date before collecting a separate delivery payment."
    note: "November 10 is a proposed planning cutoff, not a verified farm deadline; do not publish it as policy without approval."
  - phase: "03"
    layout: "phase"
    timeline: "November 11–24 · If Approved"
    title: "Dispatch and Document"
    list:
      - "Obtain processing-release and product handoff documentation before loading."
      - "Use suitable food-safe transport, maintaining refrigerated product at 40°F or below with a validated temperature-control method."
      - "Record temperatures at loading, during transit, and at handoff; log delivery times, recipients, and any exception."
      - "Provide realistic arrival windows, an operator contact, and a documented response to delays or loss of refrigeration."
      - "Request optional, unbiased customer feedback only after successful fulfillment."
    subtitle: "The final route schedule remains contingent on confirmed product release and service capacity."
  - tag: "Why Test It"
    layout: "cards"
    title: "Why Pilot First"
    cards:
      - title: "Existing Interest"
        text: "The farm's turkey deposit product provides a real starting point for testing the number and location of interested buyers."
      - title: "Clear Responsibility"
        text: "The farm controls sales, product and processing decisions; the delivery operator serves only documented, accepted routes under written terms."
      - title: "Consolidated Stops"
        text: "Grouping stops may lower cost per delivery, but only where it protects timing, product temperature, and service quality."
  - tag: "The Ask"
    layout: "ask"
    title: "Approve a Feasibility Review"
    subtitle: "Authorize a limited assessment of processor release, state eligibility, safe transport, economics, and the first viable corridor—not an immediate six-route launch."
    ask:
      title: "Thanksgiving Route Feasibility"
      text: "Validate one route, confirm written responsibilities, and expand only where additional corridors pass the same checks."
      button: "Review Delivery Feasibility"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20%E2%80%94%20Thanksgiving%20delivery%20feasibility"
    footer: "{{contact}}"
  - tag: "The Table"
    layout: "close"
    title: "From Farm<br>to __ACCENT2__Table."
    subtitle: "A delivery plan the farm can keep: product release, legal eligibility, safe transport, and customer commitments must agree."
    list:
      - "Six corridors are candidate plans, not accepted orders or scheduled drops."
      - "Contact Payton Byrd at 615-574-8101 to discuss feasibility."
    footer: "{{contact}}"
