# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "thanksgiving"
  title: "Thanksgiving Delivery — Agape Farmstead"
  description: "Thanksgiving delivery inside 200 miles of Nashville, batched on six corridors. Last drop November 24."
  og_title: "Thanksgiving Delivery"
  og_description: "Fresh birds on six corridors out of Nashville, inside 200 miles. Payton runs the routes. Last drop November 24."
  eyebrow: "Thanksgiving"
  blurb: "Fresh birds on six corridors out of Nashville, inside 200 miles. Payton runs the routes. Last drop November 24."
slides:
  - tag: "Thanksgiving 2026"
    layout: "hero"
    title: "Fresh Birds,<br>__ACCENT__200 Miles Out."
    subtitle: "Delivery inside 200 miles of Nashville, batched on the six corridors. Payton runs the routes. Last drop is November 24. The processor's count is the cap."
    stats:
      - n: "200"
        l: "Mile Radius"
      - n: "11/24"
        l: "Last Drop"
      - n: "6"
        l: "Corridors"
  - tag: "The Split"
    layout: "list"
    title: "Who Does What"
    list:
      - "The farm keeps the birds, the processor, and the handoff."
      - "Payton delivers. One corridor, one route day."
      - "A stop rides with its corridor, or it waits for the next batch."
      - "Orders close November 10. Nothing goes out on Thanksgiving Day."
      - "The farm's $20 turkey deposit stays the farm's. This proposal is the routes around it."
  - tag: "The Zone Map"
    layout: "map"
    title: "Nashville at the Center"
    map: "zones"
    caption: "Six corridors leave Nashville. Each one is a batch. Adams is the farm."
  - tag: "The Route Map"
    layout: "map"
    title: "Six Routes Out"
    map: "routes"
    caption: "Arrows leave Nashville. Numbers are the stop order on that route."
  - tag: "The Batches"
    layout: "cards"
    title: "The Six Corridors"
    cards:
      - title: "I-24 Northwest"
        text: "Adams, Clarksville, Hopkinsville, and Paducah."
      - title: "I-24 Southeast"
        text: "Murfreesboro and Chattanooga."
      - title: "I-65 North"
        text: "Bowling Green."
      - title: "I-65 South"
        text: "Franklin and Huntsville."
      - title: "I-40 East"
        text: "Cookeville and Knoxville."
      - title: "I-40 West"
        text: "Dickson and Jackson."
    note: "Hopkinsville, Paducah, and Bowling Green still need a clear answer at the Kentucky line. The six corridors stay."
  - phase: "01"
    layout: "phase"
    timeline: "October 24–31"
    title: "Set the Routes"
    list:
      - "Bird count from the processor. That count is the only cap."
      - "Six batches, one for each corridor."
      - "The page goes up with the roads on it. If the processor date is already gone, say so before anyone orders."
    note: "Orders close November 10. Last drop is November 24."
  - phase: "02"
    layout: "phase"
    timeline: "November 1–10"
    title: "Fill the Routes"
    list:
      - "Take orders inside the radius. Stop at the cap."
      - "A waitlist is fine. A promise past the bird count is not."
      - "Cold chain is an insulated box, ice, and a window measured in hours."
      - "Add-ons only in the same box: eggs, ground chicken."
    subtitle: "No batch on that corridor that day, no delivery."
  - phase: "03"
    layout: "phase"
    timeline: "November 11–24"
    title: "On the Road"
    list:
      - "Each route day is one corridor out of Nashville."
      - "Last drop Tuesday, November 24."
      - "The same cutoff on the page, the text, and the voicemail."
      - "Ask for the review when the bird is in the fridge."
  - tag: "Why It Holds"
    layout: "cards"
    title: "Why This Holds"
    cards:
      - title: "The Birds Are Already Raised"
        text: "A fresh local turkey that week is hard to find. The farm already has them."
      - title: "The Driver Is Set"
        text: "Payton delivers. The farm does not have to become a trucking company to cover the radius."
      - title: "Batched on Purpose"
        text: "Birds on one corridor ride together. A single door does not get its own trip."
  - tag: "The Ask"
    layout: "ask"
    title: "Run the Radius"
    subtitle: "The farm brings the birds and the processor. Payton brings the routes, the sheet, and the order page."
    ask:
      title: "Thanksgiving, Inside 200 Miles"
      text: "Six corridors. One batch each. Orders through November 10. Last drop November 24."
      button: "Run the Radius"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20Thanksgiving%20delivery"
    footer: "{{contact}}"
  - tag: "The Table"
    layout: "close"
    title: "From the Farm<br>to __ACCENT2__the Table."
    subtitle: "The radius is the work. Orders open once the bird count and the six routes are written down."
    list:
      - "Payton Byrd, 615-574-8101"
    footer: "{{contact}}"
