# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "seo"
  title: "SEO Pilot Proposal for Remy Powell — Agape Farmstead"
  description: "Prepared for Remy Powell, Agape Farmstead owner. A measured local-search pilot for your review, with evidence-based fixes and your approval before publication."
  og_title: "Remy Powell — Local Search & Content Pilot"
  og_description: "A proposal for Remy Powell to improve Agape Farmstead's search presentation, customer ordering clarity, and local visibility using verified findings."
  eyebrow: "Prepared for Remy · Local Search"
  blurb: "A measurable two-week pilot for your consideration, with verified findings and no changes to your farm website without your approval."
slides:
  - tag: "For Remy Powell · SEO Proposal"
    layout: "hero"
    title: "Help Customers<br>__ACCENT__Find Your Farm."
    subtitle: "Remy, Agape already has products, a local market presence, and a documented managed-grazing project. This proposal shows how we could make your offering clearer to nearby customers, starting with verified evidence rather than untested SEO claims."
    stats:
      - n: "Observed"
        l: "Generic Team Page Title"
      - n: "To Verify"
        l: "Metadata & Structured Data"
      - n: "To Capture"
        l: "Your Search Baseline"
  - tag: "Your Existing Strengths"
    layout: "list"
    title: "What Your Farm Already Has"
    list:
      - "Your catalog describes pasture-raised poultry, eggs, lamb, pork, and other farm products."
      - "Your team page introduces the people involved in your operation and their agricultural work."
      - "The Cumberland River Compact documents a managed-grazing project at Agape Farmstead; that is specific project evidence, not independent proof of certification."
      - "Agape Farmstead appears in the City of Clarksville's 2026 Downtown Market vendor list."
      - "Public search results include your home, product, and team pages. Your precise Google index coverage needs Search Console verification."
  - tag: "Potential Improvements"
    layout: "cards"
    title: "Where Your Customers Need Clarity"
    cards:
      - title: "Search Result Titles"
        text: "Your Team page has appeared under the generic title Team 1 — Agape Farmstead. We can propose descriptive replacements after checking the actual titles and snippets across your priority pages."
      - title: "Products & Deposits"
        text: "Your product listings should distinguish per-pound prices from deposits, estimated totals, and the final amount due. We should also correct the Whole Turkey Depsoit typo, with your approval of checkout copy."
      - title: "Local Discovery"
        text: "Customers should readily understand where you farm, where they can buy, and how pickup works. We will verify your business profile, canonicals, sitemap, schema, and images before reporting technical defects."
  - phase: "01"
    layout: "phase"
    timeline: "Weeks 1–2 · Verify & Implement"
    title: "Your First Two Weeks"
    list:
      - "With your authorization, establish a baseline of Search Console queries, impressions, clicks, indexed URLs, and priority-page visits."
      - "Document what your site actually serves for titles, descriptions, headings, canonicals, robots, sitemap, images, and schema."
      - "Draft clearer titles and descriptions for your home, products, team, and turkey-reservation pages for your approval."
      - "Clarify deposits, per-pound prices, balances, pickup choices, and any confirmed delivery arrangements without changing your terms."
      - "Implement the approved heading, link, image-description, and supported structured-data updates; test every changed page."
    note: "Remy, you approve each public edit. Success for the pilot means agreed changes implemented and measured, not a promised ranking increase."
  - phase: "02"
    layout: "phase"
    timeline: "Weeks 2–4 · Local Presence"
    title: "Represent Your Farm Locally"
    list:
      - "Confirm which Google Business Profile belongs to your operation and whether its access and details are correct."
      - "Review your business name, category, contact details, website, public location or service area, hours, and genuine pickup options."
      - "Describe your Adams-area farm and Clarksville market presence accurately without advertising delivery areas you have not approved."
      - "Invite customers to leave honest, voluntary reviews; do not script their wording or offer incentives."
      - "Answer the questions your customers ask about reservations, deposits, variable weights, pickup windows, and contact."
  - phase: "03"
    layout: "phase"
    timeline: "Months 2–3 · Farm Stories"
    title: "Tell Your Story With Evidence"
    list:
      - "Work with you on a concise account of your team, stewardship priorities, and educational or community work."
      - "Use photographs and descriptions you have reviewed to explain your grazing and animal-care practices."
      - "Reference the Cumberland River Compact managed-grazing case study for that project, without presenting certification as verified."
      - "Measure how people search for your products and locations before labeling any keyword an opportunity."
  - tag: "The Differentiation"
    layout: "cards"
    title: "Make Your Stewardship<br>__ACCENT__Visible."
    subtitle: "Your practices and relationships are valuable when customers can verify them. We will avoid unverified certification, exclusivity, or ranking claims."
    cards:
      - title: "Help Buyers Decide"
        text: "Make it easy for a visitor to see what's available, the pricing basis, pickup location and timing, and whether a specific delivery option has been approved."
      - title: "Support Every Claim"
        text: "Introduce your people and practices, cite the managed-grazing project accurately, and publish outcomes only after you confirm the evidence."
  - tag: "Your Decision"
    layout: "ask"
    title: "Would You Authorize a Pilot?"
    subtitle: "Remy, the request is to approve a limited two-week SEO and copy pilot. Payton can prepare the proposed edits and verification report, while you retain final approval before anything changes on your farm's website."
    ask:
      title: "SEO Pilot · Your Approval Required"
      text: "Inventory, proposed page copy, ordering clarity, and documented checks. Review results at 30, 60, and 90 days after approved publication."
      button: "Discuss the SEO Pilot with Payton"
      button_href: "mailto:plbyrd@gmail.com?subject=Remy%20Powell%20%E2%80%94%20Agape%20SEO%20proposal"
    footer: "{{contact}}"
  - tag: "Next Step"
    layout: "close"
    title: "Findable Farm,<br>__ACCENT2__Clearer Orders."
    subtitle: "Remy, you decide which improvements reflect your priorities. The first step is a review of the evidence and copy before any implementation."
    list:
      - "Approve the scope, then compare results against your saved search baseline."
      - "Contact Payton Byrd at 615-574-8101 to discuss this proposal."
    footer: "{{contact}}"
