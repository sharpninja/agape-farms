# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "seo"
  title: "Search Pilot — Agape Farmstead"
  description: "Two weeks to fix titles, snippets, and the local listing so the search result matches the farm."
  og_title: "Search Pilot"
  og_description: "The Team page is indexed as Team 1. Two weeks to put the right title, snippet, and listing in front of people already looking."
  eyebrow: "Search"
  blurb: "The Team page is indexed as Team 1. Two weeks to put the right title, snippet, and listing in front of people already looking."
slides:
  - tag: "Search"
    layout: "hero"
    title: "The Result Should<br>__ACCENT__Match the Farm."
    subtitle: "People already search for Agape. The Team page comes back as Team 1, and the product pages blur the deposit into the price. Two weeks to fix the title, the snippet, and the local listing."
    stats:
      - n: "Team 1"
        l: "Indexed Title"
      - n: "2 wk"
        l: "Pilot"
      - n: "90 d"
        l: "Then We Read It"
  - tag: "What Holds"
    layout: "list"
    title: "What Already Holds"
    list:
      - "Poultry, eggs, lamb, and pork are on the site. The catalog is not the problem."
      - "The Cumberland River Compact has the managed-grazing project on record. Cite that. Don't stretch it into a certification the page can't back."
      - "Clarksville's 2026 Downtown Market list already names the farm."
      - "Home, products, and team show up for the farm's own name. The snippets are what's weak."
  - tag: "The Gaps"
    layout: "cards"
    title: "Three Gaps"
    cards:
      - title: "Titles"
        text: "Team 1 goes. Home, products, team, and the turkey page get titles a buyer can use."
      - title: "The Price"
        text: "Deposit, price per pound, and balance due are three numbers. The turkey page also says Depsoit."
      - title: "The Listing"
        text: "Adams, the Clarksville market, and pickup. The Google profile should say what the site says."
  - phase: "01"
    layout: "phase"
    title: "On the Page"
    list:
      - "Search Console baseline first: queries, clicks, indexed URLs."
      - "Rewrite titles and descriptions. You sign the copy, then it goes live."
      - "Separate the deposit from the price and fix the turkey typo."
      - "Headings, image descriptions, and LocalBusiness schema on the pages that sell."
    note: "Success is the agreed pages live and measured. Not a promised ranking."
  - phase: "02"
    layout: "phase"
    title: "The Local Listing"
    list:
      - "The Google profile that belongs to the farm: name, category, hours, pickup, site."
      - "Adams and Clarksville. Not a delivery area the farm hasn't published."
      - "Ask for the review after a real sale. Don't script it."
  - phase: "03"
    layout: "phase"
    title: "The Story"
    list:
      - "A short piece on the people and the grazing, in the farm's photos."
      - "The Compact project named as a project."
      - "Read the queries after the pages change. Call something an opportunity only when the numbers say so."
  - tag: "The Difference"
    layout: "cards"
    title: "Make the Difference<br>__ACCENT__Visible."
    subtitle: "The practices are the difference. The page should let a buyer see them without a phone call."
    cards:
      - title: "A Buyer Can Decide"
        text: "What's for sale, how the price works, and where pickup is."
      - title: "The Claim Has a Source"
        text: "The people, the animals, and the Compact project. Nothing past what the farm can point to."
  - tag: "The Ask"
    layout: "ask"
    title: "Two Weeks"
    subtitle: "Baseline, rewrites, listing. Read it again at 30, 60, and 90 days."
    ask:
      title: "Start the Pilot"
      text: "Page copy, the price language, and the listing. You sign what goes public."
      button: "Start the Pilot"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20search%20pilot"
    footer: "{{contact}}"
  - tag: "Next"
    layout: "close"
    title: "Findable,<br>__ACCENT2__and Accurate."
    subtitle: "The farm is already doing the hard part. This makes the result say so."
    list:
      - "Payton Byrd, 615-574-8101"
    footer: "{{contact}}"
