# Source content for ProposalDecks. Rebuild generated docs/ after merging.
meta:
  slug: "seo"
  title: "Local Search & Content Pilot — Agape Farmstead"
  description: "Evidence-based SEO pilot for Agape Farmstead: confirm technical findings, improve priority page copy, clarify ordering, and establish performance baselines."
  og_title: "Local Search & Content Pilot"
  og_description: "A measured two-week pilot to improve Agape Farmstead's local search presentation and product information, followed by 30-, 60-, and 90-day reviews."
  eyebrow: "Phase 1 — Local Search"
  blurb: "Audit, revise, and validate priority pages; separate verified findings from checks still requiring source or account access."
slides:
  - tag: "SEO & Content Review"
    layout: "hero"
    title: "Make the Farm<br>__ACCENT__Easier to Find.__"
    subtitle: "Agape has real farm products, an identifiable team, local market participation, and an independently documented managed-grazing project. The first step is to verify the technical baseline and make product, place, and ordering information clearer."
    stats:
      - n: "Observed"
        l: "Generic Team Page Title"
      - n: "Verify"
        l: "Raw Metadata & Schema"
      - n: "Baseline"
        l: "Search Console & Analytics"
  - tag: "What's Working"
    layout: "list"
    title: "Assets Worth Showing"
    list:
      - "The farm publishes product details for pasture-raised poultry, eggs, lamb, pork, and other items."
      - "Its team page identifies people behind the farm and their agricultural work."
      - "The Cumberland River Compact documents a managed-grazing project at Agape Farmstead; this does not independently establish certification."
      - "Agape Farmstead is listed among the City of Clarksville's 2026 Downtown Market vendors."
      - "Public searches returned the farm's homepage, product catalog, and team page; exact Google indexing counts remain unverified."
  - tag: "What Needs Attention"
    layout: "cards"
    title: "Where to Improve"
    cards:
      - title: "Search Result Titles"
        text: "The public Team page appears as 'Team 1 — Agape Farmstead.' Replace generic titles and review each priority page's actual title and meta description before claiming any metadata is absent."
      - title: "Ordering Clarity"
        text: "Products mix per-pound rates with deposits and final-weight calculations. Label units and payment terms separately. Correct 'Whole Turkey Depsoit' after confirming farm-approved checkout wording."
      - title: "Local Relevance"
        text: "Clarify the Adams-area farm and its Clarksville market presence near the primary content. Verify the business profile, canonical URLs, sitemap, structured data, and image alternatives before marking them defective."
  - phase: "01"
    layout: "phase"
    timeline: "Weeks 1–2 · Verify & Implement"
    title: "Build a Measurable Foundation"
    list:
      - "Capture Search Console and analytics baselines: queries, impressions, clicks, indexed URLs, and priority-page visits."
      - "Inventory real titles, meta descriptions, headings, canonicals, robots/sitemap behavior, images, and structured data; retain evidence for each finding."
      - "Propose page-specific titles and descriptions for the home, products, team, and turkey reservation pages; implement only after farm approval."
      - "Clarify per-pound prices, deposits, final-weight charges, pickup and delivery arrangements, and ordering FAQs without changing approved commercial terms."
      - "Improve meaningful headings, internal links, descriptive image alternatives, and validated structured data only where the business facts support them."
    note: "Acceptance: agreed pages updated, technical tests documented, and baseline captured. A ranking increase in two weeks is not guaranteed."
  - phase: "02"
    layout: "phase"
    timeline: "Weeks 2–4 · Local Presence"
    title: "Verify the Listing"
    list:
      - "Confirm ownership and the correct Google Business Profile before asserting that a listing exists, is incomplete, or needs to be created."
      - "Verify business name, category, contact details, website, public location or service area, hours, and actual pickup options."
      - "Explain Adams-area farming and Clarksville market participation accurately; do not imply unapproved delivery coverage."
      - "Invite voluntary, authentic customer reviews without incentives or coached keywords."
      - "Publish practical answers on reservations, deposits, weight-based prices, fulfillment windows, and contact channels."
  - phase: "03"
    layout: "phase"
    timeline: "Months 2–3 · Farm Stories"
    title: "Show the Work Behind the Food"
    list:
      - "Publish a concise, verified story of the farmers and their agricultural and educational work."
      - "Explain grazing and animal-care practices using farm-approved photographs and precise, factual language."
      - "Link to the Cumberland River Compact managed-grazing case study as evidence of that specific project—not as proof of certification."
      - "Test product-and-location search queries using Search Console, rather than declaring any keyword 'winnable' without data."
  - tag: "The Differentiation"
    layout: "cards"
    title: "A Story Customers<br>Can __ACCENT__Verify.__"
    subtitle: "Show practices and relationships the farm can document. Avoid claims that no competitor shares the same values or that a certification has been confirmed."
    cards:
      - title: "Local Buying Intent"
        text: "Show what is available, how it is priced, where collection happens, and whether delivery can be arranged."
      - title: "Credible Evidence"
        text: "Introduce the farmers, connect their stewardship story to the documented managed-grazing project, and publish measurements only when verified."
  - tag: "The Ask"
    layout: "ask"
    title: "The Pilot Decision"
    subtitle: "Approve a two-week implementation scope and a farm review of all public copy. Evaluate search performance at 30, 60, and 90 days rather than attributing an immediate ranking lift to the edits."
    ask:
      title: "Phase 1 — Verified Fixes"
      text: "Metadata and copy inventory, priority-page revisions, ordering clarity, and documented technical checks. Farm approval before publication."
      button: "Review Phase 1 Scope"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20%E2%80%94%20SEO%20pilot%20scope"
    footer: "{{contact}}"
  - tag: "Next Step"
    layout: "close"
    title: "Better Search,<br>__ACCENT2__Clearer Orders.__"
    subtitle: "Make documented improvements now; resolve remaining technical questions with page-source access and verified business information."
    list:
      - "Track changes against a saved baseline at 30, 60, and 90 days."
      - "Contact Payton Byrd at 615-574-8101 to review the proposal."
    footer: "{{contact}}"
