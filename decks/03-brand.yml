# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "brand"
  title: "The Online Plan — Agape Farmstead"
  description: "After the search work and the Thanksgiving routes, Remy and Payton write the long-term online plan."
  og_title: "The Online Plan"
  og_description: "The long-term plan, written together once the work and the routes are real."
  eyebrow: "The Long Term"
  blurb: "Built on the search work and on Payton being there for the routes. Remy and Payton write the long-term plan."
slides:
  - tag: "The Offer"
    layout: "hero"
    title: "Write the<br>__ACCENT__Plan."
    subtitle: "This sits on the other two decks. The search work shows what Payton does. The routes show he is there to do it. The long-term plan is what we write after that. This deck is not the plan."
    stats:
      - n: "2"
        l: "People"
      - n: "1"
        l: "Plan"
      - n: "0"
        l: "Campaigns Yet"
  - tag: "The Decisions"
    layout: "list"
    title: "What the Plan Has to Decide"
    list:
      - "Who the buyer is."
      - "What the site has to do for that buyer."
      - "What the list is for."
      - "What the farm will not do online."
  - tag: "The Split"
    layout: "cards"
    title: "Who Decides What"
    cards:
      - title: "Remy"
        text: "What the farm says, and what it sells."
      - title: "Payton"
        text: "The pages and the mechanics those decisions need."
  - tag: "Not Yet"
    layout: "list"
    title: "Out Until the Plan Says So"
    list:
      - "Ads."
      - "A blog."
      - "Extra social accounts."
      - "A new store."
    subtitle: "None of these until the plan calls for them."
  - tag: "The Ask"
    layout: "ask"
    title: "Sit Down"
    subtitle: "Make the plan. The first product is the decisions, not a campaign."
    ask:
      title: "Write It Together"
      text: "One sitting, after the pages and the routes. The decisions on the table. Nothing published from this deck until those are made."
      button: "Make the Plan"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20online%20plan"
    footer: "{{contact}}"
