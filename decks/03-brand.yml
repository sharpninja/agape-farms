# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "brand"
  title: "Growth Roadmap Proposal for Remy Powell — Agape Farmstead"
  description: "Prepared for Remy Powell, Agape Farmstead owner. A milestone-based five-year growth proposal that leaves all strategic decisions with Remy."
  og_title: "Remy Powell — Agape Farmstead Growth Roadmap"
  og_description: "A proposal for Remy to strengthen Agape Farmstead's stewardship story, local discovery, repeat relationships, and measured expansion."
  eyebrow: "Prepared for Remy · Growth Roadmap"
  blurb: "A five-year direction for your consideration, starting with practical improvements and keeping later expansion under your control."
slides:
  - tag: "For Remy Powell · Five-Year Direction"
    layout: "hero"
    title: "Grow Your Farm<br>__ACCENT__On Your Terms."
    subtitle: "Remy, this is a possible sequence of decisions, not a commitment to expand. You could start with better local discovery and customer relationships, then pursue new products or markets only when your land, family, margins, and capacity support them."
    stats:
      - n: "5"
        l: "Year Planning Horizon"
      - n: "3"
        l: "Land · People · Purpose"
      - n: "1"
        l: "Year for Initial Decisions"
  - tag: "Three Pillars"
    layout: "cards"
    title: "Your Farm's Three Pillars"
    cards:
      - pillar: "Land"
        title: "Your Stewardship"
        text: "Your managed-grazing project is documented by the Cumberland River Compact. We can tell that story accurately while verifying any further certification or outcome claims before publication."
      - pillar: "People"
        title: "Your Relationships"
        text: "Your market customers, neighbors, educators, and community connections are the starting point for better repeat ordering and communication."
      - pillar: "Purpose"
        title: "Your Faith-Driven Mission"
        text: "Your Christian stewardship values can guide both customer care and the decisions you make about the farm's future."
  - tag: "Year One"
    layout: "phase"
    timeline: "Months 1–12"
    title: "Year One · Build Your Foundation"
    list:
      - "Choose whether to authorize a local-search pilot, keep the baseline, and review outcomes at 30, 60, and 90 days."
      - "Collect permission-based email signups from customers who want updates about your products and market appearances."
      - "Approve a library of farm photographs and a founder story that represents you and your team accurately."
      - "Share the documented managed-grazing project without asserting certifications that have not been verified."
      - "Consider a holiday delivery pilot only after you approve product availability, compliance, cold-chain controls, capacity, and economics."
    subtitle: "You select the year-one scope; Thanksgiving delivery remains a separate proposal."
  - tag: "Year Two"
    layout: "phase"
    timeline: "Months 13–24"
    title: "Year Two · Build Repeat Demand"
    list:
      - "Consider recurring pickup or ordering for products you can supply reliably."
      - "Test interest in a meat share or seasonal box only after reviewing contribution margin."
      - "Explore wholesale inquiries if your processing, packaging, price, and fulfillment capacity can support them."
      - "Send a farm update at a cadence you can maintain and customers have agreed to receive."
      - "Offer educational visits or internship activities only if you and your family want them and can manage them safely."
    subtitle: "The goal is more dependable relationships, not more channels for their own sake."
  - tag: "Year Three"
    layout: "phase"
    timeline: "Months 25–36"
    title: "Year Three · Expand If Earned"
    list:
      - "Add another processor only if your current capacity is a proven bottleneck and the cost makes sense."
      - "Hire marketing or fulfillment help only when repeat-order contribution can cover it."
      - "Develop educational opportunities within the supervision and time you can provide."
      - "Test adjacent products after demand for your current products is established."
      - "Set your own minimum profitability and operating thresholds before authorizing new sales channels."
    subtitle: "You remain free to delay, change, or decline any expansion."
  - tag: "Years Four & Five"
    layout: "phase"
    timeline: "Months 37–60 · Conditional"
    title: "Years Four & Five · Keep Your Options"
    list:
      - "Use repeat rate, cash generation, and farm economics to decide whether a broader delivery area is desirable."
      - "Treat any Nashville location, wholesale relationship, or pickup point as a separate investment to evaluate."
      - "Keep family workload, land stewardship, and succession on a timetable you control."
      - "Choose whether to publish soil, habitat, or grazing measurements after methods and results have been verified."
    subtitle: "No later-year facility, expansion, or expenditure is presumed to have your approval."
  - tag: "What Sustainability Means"
    layout: "cards"
    title: "Your Definition of Sustainability"
    cards:
      - title: "Ecological"
        text: "Protect soil, forage, and water while choosing what projects or measured outcomes you are comfortable documenting publicly."
      - title: "Economic"
        text: "Give each channel a financial test so growth does not consume resources better used on your existing operation."
      - title: "Purpose"
        text: "Let your faith, educational work, and community relationships inform the way you operate rather than turning them into unverified promotional claims."
    note: "Remy, the roadmap is a tool for your decisions. It should change whenever your circumstances or priorities change."
  - tag: "Your Decision"
    layout: "ask"
    title: "Which First-Year Work Fits?"
    subtitle: "Remy, you could begin with a bounded SEO effort, opt-in customer communication, and an accurate farm story. Delivery and further sales channels would each need their own operational and financial review."
    ask:
      title: "Choose the Year-One Scope"
      text: "Decide what to authorize now, what to measure each quarter, and what should remain an option rather than a commitment."
      button: "Discuss the Roadmap with Payton"
      button_href: "mailto:plbyrd@gmail.com?subject=Remy%20Powell%20%E2%80%94%20Agape%20growth%20proposal"
    footer: "{{contact}}"
  - tag: "The Long View"
    layout: "close"
    title: "Your Farm,<br>__ACCENT__Your Next Season."
    subtitle: "The choices remain yours, Remy. The value of this proposal is a practical sequence that protects your stewardship, time, and customer relationships."
    list:
      - "Begin with work you approve and measurable results before considering a larger commitment."
      - "Contact Payton Byrd at 615-574-8101 to review the plan."
    footer: "{{contact}}"
