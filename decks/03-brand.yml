# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "brand"
  title: "Five Years — Agape Farmstead"
  description: "Year one is search, a list, and a record of the farm. Later years open when repeat orders and the processor can carry them."
  og_title: "Five Years"
  og_description: "Findable this year. Repeat orders next year. Nothing after that the farm has not earned."
  eyebrow: "Five Years"
  blurb: "Findable this year. Repeat orders next year. Nothing after that the farm has not earned."
slides:
  - tag: "Five Years"
    layout: "hero"
    title: "Built to<br>__ACCENT__Last."
    subtitle: "The sequence, not a contract for year five. Year one makes the farm findable and keeps a list. The rest opens when repeat orders and the processor can carry it."
    stats:
      - n: "5"
        l: "Year Horizon"
      - n: "3"
        l: "Pillars"
      - n: "1"
        l: "Year to Start"
  - tag: "Three Pillars"
    layout: "cards"
    title: "Land, People, Purpose"
    cards:
      - pillar: "Land"
        title: "Stewardship"
        text: "Grazing that holds the soil and the water. The Compact project is the public record. Say that, and stop there until there's more to show."
      - pillar: "People"
        title: "The Network"
        text: "Market regulars, the church network, and delivery customers compound. Ads do not replace them."
      - pillar: "Purpose"
        title: "The Spine"
        text: "The biblical foundation is why the work is consistent. In a market full of wellness claims, that is what people remember."
  - tag: "Year One"
    layout: "phase"
    timeline: "Months 1–12"
    title: "Findable"
    list:
      - "The search pilot, with a baseline before anything changes."
      - "An email list from market day and from orders."
      - "A photo library and a short account of the people."
      - "The Compact project on every page that sells meat. Named as a project."
      - "Thanksgiving delivery inside 200 miles, on the six corridors."
    subtitle: "Year one is findable, remembered, and delivered."
  - tag: "Year Two"
    layout: "phase"
    timeline: "Months 13–24"
    title: "Repeat"
    list:
      - "Eggs, seasonal boxes, and the holidays, more than once a year."
      - "Wholesale only with kitchens that are already asking, and only if the processor can feed it."
      - "A simple egg or meat share once the margin is real."
      - "A note from the farm when there is something to say."
      - "Visits and the internship if the family wants guests."
    subtitle: "Year two turns a holiday buyer into someone who comes back."
  - tag: "Year Three"
    layout: "phase"
    timeline: "Months 25–36"
    title: "Capacity"
    list:
      - "A second processor only if the current date is the bottleneck."
      - "Help with the work only after repeat orders can carry it."
      - "The internship named as a path into the work."
      - "Another product after the meat boxes are already repeating."
      - "Three numbers: repeat rate, list size, and which doors bring people back."
    subtitle: "Year three is when repeat orders carry the year."
  - tag: "Years Four and Five"
    layout: "phase"
    timeline: "Months 37–60"
    title: "Earned, or Not"
    list:
      - "A wider map only if repeat orders and the processor can take more."
      - "A Nashville presence is its own decision."
      - "Succession and the land stay on the family's clock."
      - "Soil tests go public when the farm wants that proof public."
    subtitle: "These years are not a plan. They are what the first three make possible."
  - tag: "Sustainability"
    layout: "cards"
    title: "What Has to Hold"
    cards:
      - title: "The Land"
        text: "Soil, forage, and water. The Compact project is the receipt so far."
      - title: "The Books"
        text: "Market, delivery, wholesale, a share. No single door gets to sink the year."
      - title: "The Purpose"
        text: "Faith and the people around the farm. Soil alone, or revenue alone, is not the farm."
  - tag: "The Ask"
    layout: "ask"
    title: "Year One"
    subtitle: "Search, the list, and the Thanksgiving routes. The later years stay closed until those earn them."
    ask:
      title: "Start With Year One"
      text: "Quarterly look at search, the list, and repeat orders. No dashboard until there is something to put on it."
      button: "Start Year One"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20year%20one"
    footer: "{{contact}}"
  - tag: "The Long View"
    layout: "close"
    title: "Plant Trees<br>You'll Never<br>__ACCENT__Sit Under."
    subtitle: "The farm already lives this. The proposal names the order, and leaves the later years closed until they are earned."
    list:
      - "Payton Byrd, 615-574-8101"
    footer: "{{contact}}"
