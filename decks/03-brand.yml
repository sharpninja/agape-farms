# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "brand"
  title: "The Online Plan — Agape Farmstead"
  description: "Remy and Payton write the long-term online plan together. This deck starts that work. The plan does not exist yet."
  og_title: "The Online Plan"
  og_description: "A proposal to sit down and write the long-term online plan. The first product is the decisions, not a campaign."
  eyebrow: "Online"
  blurb: "Remy and Payton write the long-term online plan together. The plan does not exist yet."
slides:
  - tag: "The Offer"
    layout: "hero"
    title: "Write the<br>__ACCENT__Plan."
    subtitle: "Remy and Payton write the long-term online plan. This deck starts that work. It is not the plan."
    stats:
      - n: "2"
        l: "People"
      - n: "1"
        l: "Plan"
      - n: "0"
        l: "Campaigns Yet"
  - tag: "The Decisions"
    layout: "list"
    title: "What the Plan Has to Decide"
    list:
      - "Who the buyer is."
      - "What the site has to do for that buyer."
      - "What the list is for."
      - "What the farm will not do online."
  - tag: "The Split"
    layout: "cards"
    title: "Who Decides What"
    cards:
      - title: "Remy"
        text: "What the farm says, and what it sells."
      - title: "Payton"
        text: "The pages and the mechanics those decisions need."
  - tag: "Not Yet"
    layout: "list"
    title: "Out Until the Plan Says So"
    list:
      - "Ads."
      - "A blog."
      - "Extra social accounts."
      - "A new store."
    subtitle: "None of these until the plan calls for them."
  - tag: "The Ask"
    layout: "ask"
    title: "Sit Down"
    subtitle: "Make the plan. The first product is the decisions, not a campaign."
    ask:
      title: "Write It Together"
      text: "One sitting. The decisions on the table. Nothing published from this deck until those are made."
      button: "Make the Plan"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20online%20plan"
    footer: "{{contact}}"
