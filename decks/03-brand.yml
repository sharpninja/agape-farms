# Source content for ProposalDecks. Rebuild generated docs/ after merging.
meta:
  slug: "brand"
  title: "Sustainable Growth Roadmap — Agape Farmstead"
  description: "A five-year, milestone-gated roadmap for Agape Farmstead combining documented stewardship, repeat customer relationships, and disciplined business expansion."
  og_title: "Sustainable Growth Roadmap"
  og_description: "Five-year direction, one-year initial scope: improve discovery, test repeat demand, and expand only when margin and capacity support it."
  eyebrow: "Years 1–5 — Staged Growth"
  blurb: "Strengthen search and repeat relationships now; add products, channels, and geography only after demand, margin, and capacity are established."
slides:
  - tag: "Five-Year Brand Vision"
    layout: "hero"
    title: "Grow at the Farm's<br>__ACCENT__Own Pace.__"
    subtitle: "This is a staged direction, not a five-year promise. Make Agape easier to find and order from, test repeat relationships, and expand only when farm capacity, demand, stewardship, and contribution margin justify it."
    stats:
      - n: "5"
        l: "Years · Planning Horizon"
      - n: "3"
        l: "Pillars · Land, People, Purpose"
      - n: "1"
        l: "Year · Initial Review Cycle"
  - tag: "Three Pillars"
    layout: "cards"
    title: "Three Pillars"
    cards:
      - pillar: "Land"
        title: "Documented Stewardship"
        text: "The Cumberland River Compact's managed-grazing project documents a specific conservation effort. Discuss grazing, animal care, and measured outcomes accurately; no unverified certification claims."
      - pillar: "People"
        title: "Repeat Relationships"
        text: "Market buyers, neighbors, educators, faith communities, and delivery customers can become repeat customers through reliable availability and clear ordering."
      - pillar: "Purpose"
        title: "Faith-Driven Service"
        text: "Honor the farm's Christian commitment to stewardship and community in both the stories it tells and the customer experience it provides."
  - tag: "Year One"
    layout: "phase"
    timeline: "Months 1–12"
    title: "Foundation"
    list:
      - "Complete the approved SEO pilot, preserve a Search Console baseline, and review results at 30, 60, and 90 days."
      - "Gather opt-in email subscriptions with clear consent and a working unsubscribe option."
      - "Create an approved farm photo library and concise founder story with permission from the people pictured."
      - "Link the verified Cumberland River Compact managed-grazing project without asserting an unverified certification."
      - "Run only approved holiday delivery pilots that pass product, compliance, capacity, cold-chain, and margin checks."
    subtitle: "Year one creates a measurable foundation; the delivery pilot is a separate decision."
  - tag: "Year Two"
    layout: "phase"
    timeline: "Months 13–24"
    title: "Prove Repeat Demand"
    list:
      - "Test recurring pickup or ordering arrangements only for products with dependable availability."
      - "Evaluate a meat-share or seasonal box using measured contribution margin and customer interest."
      - "Investigate wholesale opportunities only after confirming processing, packaging, pricing, and fulfillment economics."
      - "Send useful, permission-based farm updates at a cadence the family can sustain."
      - "Consider educational visits and internships only if capacity, safety, and family preference allow."
    subtitle: "Return customers matter more than a channel count."
  - tag: "Year Three"
    layout: "phase"
    timeline: "Months 25–36"
    title: "Expand Selectively"
    list:
      - "Add another processor only if a measured capacity bottleneck and unit economics justify it."
      - "Add staff or contract help only when recurring contribution covers the cost."
      - "Support educational opportunities with clear responsibilities and available supervision."
      - "Pilot adjacent products after demand for core items is demonstrated."
      - "Set minimum margin and operational-capacity thresholds before opening any new channel."
    subtitle: "Expansion follows evidence, not a date on the calendar."
  - tag: "Years Four & Five"
    layout: "phase"
    timeline: "Months 37–60 · Conditional"
    title: "Preserve Options"
    list:
      - "Let retention, cash generation, and farm profitability determine whether wider service areas are justified."
      - "Treat a Nashville wholesale or pickup presence as a separate investment decision."
      - "Keep land access, family workload, and succession planning under the farm's control."
      - "Publish soil, habitat, or grazing measures only with validated methods and the farm's approval."
    subtitle: "No additional geography, facility, or sales channel is preapproved."
  - tag: "What Sustainability Means"
    layout: "cards"
    title: "What Sustainability Means"
    cards:
      - title: "Ecological"
        text: "Improve grazing, forage recovery, and water protection; document specific projects and measured results where evidence exists."
      - title: "Economic"
        text: "Require each sales channel to cover its incremental costs and justify its use of scarce farm capacity."
      - title: "Purpose"
        text: "Make faith commitments, educational work, and community relationships part of operations rather than unsupported marketing claims."
    note: "The roadmap remains adjustable as conditions and documented results change."
  - tag: "The Ask"
    layout: "ask"
    title: "Agree on a Bounded Year One"
    subtitle: "Pilot local-search improvements, opt-in communications, and verified farm storytelling. Consider delivery only after product, legal, operational, and financial requirements have been satisfied."
    ask:
      title: "Year One Scope"
      text: "Review key metrics each quarter before authorizing new channels, costs, or geographic expansion."
      button: "Discuss Year One Scope"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead%20%E2%80%94%20Year%20One%20roadmap"
    footer: "{{contact}}"
  - tag: "The Long View"
    layout: "close"
    title: "Earn the Next<br>__ACCENT__Season.__"
    subtitle: "Protect the farm's stewardship and relationships while making each expansion decision accountable to demand and capacity."
    list:
      - "Year one: verify, implement, and measure before scaling."
      - "Contact Payton Byrd at 615-574-8101 to review the roadmap."
    footer: "{{contact}}"
