# Prepared for Remy Powell, owner of Agape Farmstead.
meta:
  slug: "brand"
  title: "The Work — Agape Farmstead"
  description: "Search, a list, and a record of the farm. The rest waits until repeat orders and the processor can carry it."
  og_title: "The Work"
  og_description: "Findable first. Repeat orders next. Nothing further until the farm has earned it."
  eyebrow: "The Work"
  blurb: "Findable first. Repeat orders next. Nothing further until the farm has earned it."
slides:
  - tag: "The Work"
    layout: "hero"
    title: "Built to<br>__ACCENT__Last."
    subtitle: "The order of the work, not a calendar. First the farm is findable and has a list. The rest opens when repeat orders and the processor can carry it."
    stats:
      - n: "3"
        l: "Pillars"
      - n: "Search"
        l: "First"
      - n: "Routes"
        l: "With It"
  - tag: "Three Pillars"
    layout: "cards"
    title: "Land, People, Purpose"
    cards:
      - pillar: "Land"
        title: "Stewardship"
        text: "Grazing that holds the soil and the water. The Compact project is the public record. Say that, and stop there until there's more to show."
      - pillar: "People"
        title: "The Network"
        text: "Market regulars, the church network, and delivery customers compound. Ads do not replace them."
      - pillar: "Purpose"
        title: "The Spine"
        text: "The biblical foundation is why the work is consistent. In a market full of wellness claims, that is what people remember."
  - tag: "Findable"
    layout: "phase"
    title: "Findable"
    list:
      - "The search pilot, with a baseline before anything changes."
      - "An email list from the market and from orders."
      - "A photo library and a short account of the people."
      - "The Compact project on every page that sells meat. Named as a project."
      - "Thanksgiving delivery inside 200 miles, on the six corridors."
    subtitle: "Findable, remembered, and delivered."
  - tag: "Repeat"
    layout: "phase"
    title: "Repeat"
    list:
      - "Eggs, seasonal boxes, and the holidays, more than once."
      - "Wholesale only with kitchens that are already asking, and only if the processor can feed it."
      - "A simple egg or meat share once the margin is real."
      - "A note from the farm when there is something to say."
      - "Visits and the internship if the family wants guests."
    subtitle: "A holiday buyer who comes back."
  - tag: "Capacity"
    layout: "phase"
    title: "Capacity"
    list:
      - "A second processor only if the current date is the bottleneck."
      - "Help with the work only after repeat orders can carry it."
      - "The internship named as a path into the work."
      - "Another product after the meat boxes are already repeating."
      - "Three numbers: repeat rate, list size, and which doors bring people back."
    subtitle: "Repeat orders carry the work."
  - tag: "After That"
    layout: "phase"
    title: "Earned, or Not"
    list:
      - "A wider map only if repeat orders and the processor can take more."
      - "A Nashville presence is its own decision."
      - "Succession and the land stay on the family's clock."
      - "Soil tests go public when the farm wants that proof public."
    subtitle: "Not a plan. What the first work makes possible."
  - tag: "Sustainability"
    layout: "cards"
    title: "What Has to Hold"
    cards:
      - title: "The Land"
        text: "Soil, forage, and water. The Compact project is the receipt so far."
      - title: "The Books"
        text: "Market, delivery, wholesale, a share. No single door gets to sink the operation."
      - title: "The Purpose"
        text: "Faith and the people around the farm. Soil alone, or revenue alone, is not the farm."
  - tag: "The Ask"
    layout: "ask"
    title: "Start Here"
    subtitle: "Search, the list, and the Thanksgiving routes. The rest stays closed until those earn it."
    ask:
      title: "Start With the List and the Routes"
      text: "Look at search, the list, and repeat orders. No dashboard until there is something to put on it."
      button: "Start Here"
      button_href: "mailto:plbyrd@gmail.com?subject=Agape%20Farmstead"
    footer: "{{contact}}"
  - tag: "The Long View"
    layout: "close"
    title: "Plant Trees<br>You'll Never<br>__ACCENT__Sit Under."
    subtitle: "The farm already lives this. The proposal names the order, and leaves the rest closed until it is earned."
    list:
      - "Payton Byrd, 615-574-8101"
    footer: "{{contact}}"
